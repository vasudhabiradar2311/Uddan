name: CI/CD Pipeline to AWS

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Spring Boot Jar
        run: |
          cd filght-booking-backend/FLIGHT_BOOKING
          mvn clean package -DskipTests

      - name: Build & Push Backend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: flight-spring-backend
        run: |
          cd filght-booking-backend/FLIGHT_BOOKING
          docker build -t $REGISTRY/$REPO_NAME:latest .
          docker push $REGISTRY/$REPO_NAME:latest

      - name: Build & Push Frontend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO_NAME: flight-react-frontend
        run: |
          cd filght-booking-frontend
          docker build -t $REGISTRY/$REPO_NAME:latest .
          docker push $REGISTRY/$REPO_NAME:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \vert{} docker login --username AWS --password-stdin${{ steps.login-ecr.outputs.registry }}
            docker pull ${{ steps.login-ecr.outputs.registry }}/flight-spring-backend:latest
            docker pull ${{ steps.login-ecr.outputs.registry }}/flight-react-frontend:latest
            cd /home/ubuntu/Filght-booking-master
            docker compose down
            docker compose up -d
